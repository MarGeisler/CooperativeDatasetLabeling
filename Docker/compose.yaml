services:  
  cooplabeling:
    build: . # osrf/ros:noetic-desktop-full
    container_name: coopdata_labeling
    restart: always
    stdin_open: true 
    tty: true 
    ports: 
      - 8081:8081
    expose:
      - "8081"
    volumes:
      - /media/ssd1/CooperativeDatasetLabeling:/root/CooperativeDatasetLabeling:rw
